# OpenLineage transport for `dbt-ol`. Datasets are emitted under the namespace
# `databricks://<host>` (derived by dbt-ol from the profile's `host:`), the job
# namespace comes from OPENLINEAGE_NAMESPACE (set it to databricks://<host>).
# The API key is read from OPENLINEAGE__TRANSPORT__AUTH__APIKEY.
transport:
  type: http
  url: {{API_HOST}}
  endpoint: api/v1/lineage?dataProductId={{DATA_PRODUCT_ID}}&outputPortId={{OUTPUT_PORT_ID}}
  auth:
    type: api_key
