name: "{{DATA_PRODUCT_NAME}} Data Product"
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

# Repository secrets:
#   ENTROPY_DATA_API_KEY
#   DATABRICKS_HOST            bare hostname, e.g. adb-1234567890123456.7.azuredatabricks.net
#   DATABRICKS_HTTP_PATH       e.g. /sql/1.0/warehouses/<warehouse-id>
#   DATABRICKS_CLIENT_ID       WRITER service principal (OAuth M2M) — dbt needs CREATE SCHEMA /
#   DATABRICKS_CLIENT_SECRET   CREATE TABLE in the output-port schema and {{INTERNAL_SCHEMA}}
# The same SP's token is reused for `datacontract test`, which only needs USE CATALOG / USE SCHEMA / SELECT.
env:
  API: {{API_HOST}}/api
  ENTROPY_DATA_HOST: {{API_HOST}}
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  DATACONTRACT_DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_HOST }}
  DATACONTRACT_DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
  OPENLINEAGE_NAMESPACE: databricks://{{DATABRICKS_HOST}}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install dbt-core dbt-databricks openlineage-dbt 'datacontract-cli[databricks]' entropy-data

      - name: Mint Databricks OAuth token (M2M) for datacontract test
        run: |
          TOKEN=$(curl -sf -X POST "https://${DATABRICKS_HOST}/oidc/v1/token" \
            -u "${DATABRICKS_CLIENT_ID}:${DATABRICKS_CLIENT_SECRET}" \
            -d 'grant_type=client_credentials&scope=all-apis' | jq -r .access_token)
          echo "::add-mask::${TOKEN}"
          echo "DATACONTRACT_DATABRICKS_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Create project-local profiles.yml
        run: cp profiles.yml.example profiles.yml

      - name: dbt run
        run: dbt-ol run --profiles-dir . --target prod
        env:
          OPENLINEAGE__TRANSPORT__AUTH__APIKEY: ${{ secrets.ENTROPY_DATA_API_KEY }}

      - name: dbt test
        run: dbt test --profiles-dir . --target prod

      - name: Publish data product
        run: entropy-data dataproducts put {{DATA_PRODUCT_ID}} --file {{ODPS_FILE}}
        env:
          ENTROPY_DATA_API_KEY: ${{ secrets.ENTROPY_DATA_API_KEY }}

      - name: Publish data contract
        run: entropy-data datacontracts put {{CONTRACT_ID}} --file models/output_ports/v1/{{CONTRACT_FILE}}
        env:
          ENTROPY_DATA_API_KEY: ${{ secrets.ENTROPY_DATA_API_KEY }}

      - name: Data contract test
        run: |
          datacontract test models/output_ports/v1/{{CONTRACT_FILE}} \
            --server {{CONTRACT_SERVER}} \
            --publish $API/test-results
        env:
          ENTROPY_DATA_API_KEY: ${{ secrets.ENTROPY_DATA_API_KEY }}
